services:
  app:
    build: .
    ports:
      # Interface disponível somente na máquina do avaliador.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Estado SQLite fora da pasta de origem; persiste em volume Docker.
      DATABASE_PATH: /app/data/runtime/knowledge.sqlite
    volumes:
      - areco_runtime:/app/data/runtime
    healthcheck:
      # python:3.12-slim não inclui curl; usar biblioteca padrão.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  areco_runtime:
